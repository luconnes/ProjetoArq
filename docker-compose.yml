services:
  queue-broker:
    image: rabbitmq:3-management
    container_name: queue-broker
    ports:
      - "5672:5672"
      - "15672:15672"

  dashboard:
    build:
      context: .
      dockerfile: ./services/dashboard/Dockerfile
    container_name: dashboard
    ports:
      - "8080:8080"
      - "8000:8000"  
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker

  humidity-sensor:
    build:
      context: .
      dockerfile: ./services/humidity-sensor/Dockerfile
    container_name: humidity-sensor
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker

  wind-sensor:
    build:
      context: .
      dockerfile: ./services/wind-sensor/Dockerfile
    container_name: wind-sensor
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker

  luminosity-sensor:
    build:
      context: .
      dockerfile: ./services/luminosity-sensor/Dockerfile
    container_name: luminosity-sensor
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker

  pressure-sensor:
    build:
      context: .
      dockerfile: ./services/pressure-sensor/Dockerfile
    container_name: pressure-sensor
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker

  sensor-temperatura:
    build:
      context: .
      dockerfile: ./services/sensor-temperatura/Dockerfile
    container_name: sensor-temperatura
    depends_on:
      - queue-broker
    environment:
      - BROKER_HOST=queue-broker